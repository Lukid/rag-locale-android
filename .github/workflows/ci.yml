name: CI

on:
  push:
    branches: [main]
  pull_request:

# NOTA: baseline Android/Gradle. Diventa eseguibile quando esistono il Gradle
# wrapper (./gradlew) e il modulo app/. Aggiorna i passi `run` con i comandi reali.
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # TODO-by-stack: scaffold del progetto Gradle non ancora presente.
      # Decommenta una volta creato ./gradlew e il modulo app/.
      - name: Unit test
        run: |
          echo "TODO: ./gradlew test --stacktrace"
          # ./gradlew test --stacktrace

      - name: Lint
        run: |
          echo "TODO: ./gradlew lint ktlintCheck"
          # ./gradlew lint ktlintCheck

  # I test strumentati (connectedAndroidTest) richiedono un emulatore: aggiungili
  # con reactivecircus/android-emulator-runner quando servono, in un job separato.
